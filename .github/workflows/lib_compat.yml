name: Lib compatibility

on:
  push:
  pull_request:

jobs:
  compat:
    runs-on: ubuntu-latest
    name: lib compat check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lib from manifest.json
        timeout-minutes: 10
        shell: bash
        run: |
          LIB=$(python3 -c "
          import json
          m = json.load(open('custom_components/casambi_bt/manifest.json'))
          casambi_req = [r for r in m['requirements'] if 'casambi' in r.lower()][0]
          print(casambi_req)
          ")
          echo "Installing: $LIB"
          # Newly published versions may not be visible on every PyPI edge yet.
          # pip's network retries do not retry "No matching distribution" errors.
          for attempt in 1 2 3 4 5 6; do
            if python -m pip install --no-cache-dir --timeout 30 --retries 2 "$LIB"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::Failed to install $LIB after $attempt attempts."
              exit 1
            fi
            echo "::warning::Installation attempt $attempt failed; retrying in 30 seconds."
            sleep 30
          done

      - name: Run compatibility tests
        run: |
          pip install pytest
          pytest tests/test_lib_compat.py -v
